{% extends "base.html" %}

{% block title %}{{ post.titulo }} — Blog eServicios{% endblock %}

{% block content %}
<nav class="breadcrumb">
    <a class="breadcrumb__link" href="{{ url_for('blog.index') }}">Blog</a>
    <span class="breadcrumb__current">{{ post.titulo }}</span>
</nav>

<article class="blog-post">
    <h1 class="blog-post__title">{{ post.titulo }}</h1>
    <p class="blog-post__meta">{{ post.publicado_en.strftime('%d de %B de %Y') if post.publicado_en else '' }}</p>
    <div class="blog-post__body">
        {{ contenido_html | safe }}
    </div>
</article>
{% endblock %}
