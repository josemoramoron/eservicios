{% extends "admin/base.html" %}

{% block title %}Iniciar sesión — Panel de administración{% endblock %}

{% block content %}
<section class="admin-auth">
    <h1 class="admin-auth__title">Panel de administración</h1>
    <form method="post" class="admin-form admin-form--narrow">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label class="admin-form__label" for="email">Correo</label>
        <input class="admin-form__input" type="email" id="email" name="email" required autofocus>

        <label class="admin-form__label" for="password">Contraseña</label>
        <input class="admin-form__input" type="password" id="password" name="password" required>

        <button class="admin-btn admin-btn--primary admin-btn--block" type="submit">Entrar</button>
    </form>
</section>
{% endblock %}
