{% extends "vendedor/base.html" %}

{% block title %}Iniciar sesión — Mi Tienda{% endblock %}

{% block breadcrumb %}
<nav class="breadcrumb">
    <a class="breadcrumb__link" href="{{ url_for('health.index') }}">eServicios</a>
    <span class="breadcrumb__current">Iniciar sesión (e-link)</span>
</nav>
{% endblock %}

{% block content %}
<section class="admin-auth">
    <h1 class="admin-auth__title">Entrar a mi tienda</h1>
    <form method="post" class="admin-form admin-form--narrow">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label class="admin-form__label" for="email">Correo</label>
        <input class="admin-form__input" type="email" id="email" name="email" required autofocus>

        <label class="admin-form__label" for="password">Contraseña</label>
        <input class="admin-form__input" type="password" id="password" name="password" required>

        <button class="admin-btn admin-btn--primary admin-btn--block" type="submit">Entrar</button>
    </form>
    <p class="admin-auth__title" style="font-size: 14px; margin-top: 16px;">
        ¿No tienes tienda todavía? <a class="admin-link" href="{{ url_for('vendedor.registro') }}">Regístrate gratis</a>.
    </p>
</section>
{% endblock %}
